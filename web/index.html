<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src wss: ws://localhost:* ws://127.0.0.1:* 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>tsudoi</title>
<meta name="description" content="A Reddit-style forum written in Kotoba. No server: posts live on Nostr relays, the site lives on IPFS.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23ff5a1f'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E9%9B%86%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main id="app"><p class="boot">connecting to relays…</p></main>
<footer>
  <div class="who">
    <span>you:</span> <code id="npub">…</code>
    <button id="reveal" type="button">show secret key</button>
    <button id="import" type="button">use my nsec</button>
    <button id="ext" type="button" hidden>use extension (NIP-07)</button>
    <input id="nsec" readonly hidden aria-label="your secret key">
  </div>
  <p id="status"></p>
  <p class="about">tsudoi is written in <a href="https://kotoba-lang.org">Kotoba</a>.
    There is no server: posts, comments and votes are signed Nostr events on the relays in settings,
    and this page is a static bundle on IPFS. Your key never leaves this browser.
    <a href="https://github.com/kotoba-lang/tsudoi">source</a></p>
</footer>
<script type="module" src="./host.mjs"></script>
</body>
</html>
